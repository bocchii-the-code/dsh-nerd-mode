<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Calibration sets one teaching level for every lecture</title>
  <desc id="desc">You approve the concept graph, then answer one question round, once per topic: your goal, what you have already read or used, and the concepts you can skip. The answers fan out to three teaching levels. Beginner uses numbered steps and explains every term. Standard is today's writing standard. Advanced takes one pass with at most one example per idea. The level is written to graph.md, and every lecture follows it. The questions, the teach-back, and the record stay the same.</desc>

  <rect x="8" y="8" width="944" height="544" rx="20" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#141414">
    <text x="480" y="62" text-anchor="middle" font-size="26" font-weight="600">One-time, before the first lecture</text>
  </g>

  <g fill="#FFFFFF" stroke="#141414" stroke-width="3.4" stroke-linejoin="round">
    <path d="M99 196 C 156 194, 226 199, 269 195 C 275 195, 279 200, 278 207 L278 306 C 278 312, 274 316, 267 315 C 206 317, 146 313, 99 316 C 92 316, 89 312, 90 305 L90 206 C 89 200, 93 196, 99 196 Z"/>
    <path d="M323 152 C 386 150, 476 155, 547 151 C 554 151, 559 156, 558 164 L558 348 C 558 355, 554 360, 546 359 C 484 361, 394 357, 323 360 C 315 360, 311 355, 312 347 L312 164 C 311 157, 315 152, 323 152 Z"/>
    <path d="M603 88 C 664 86, 794 90, 859 87 C 866 87, 871 92, 870 99 L870 184 C 870 190, 866 194, 859 193 C 794 195, 664 191, 603 194 C 596 194, 591 190, 592 183 L592 98 C 591 92, 595 88, 603 88 Z"/>
    <path d="M603 202 C 669 200, 789 204, 859 201 C 866 201, 871 206, 870 213 L870 298 C 870 304, 866 308, 859 307 C 794 309, 664 305, 603 308 C 596 308, 591 304, 592 297 L592 212 C 591 206, 595 202, 603 202 Z"/>
    <path d="M603 316 C 664 314, 794 318, 859 315 C 866 315, 871 320, 870 327 L870 412 C 870 418, 866 422, 859 421 C 794 423, 664 419, 603 422 C 596 422, 591 418, 592 411 L592 326 C 591 320, 595 316, 603 316 Z"/>
  </g>

  <g fill="none" stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
    <path d="M279 256 C 288 255, 298 257, 306 256" stroke-width="2.6"/>
    <path d="M311 256 L302 251 M311 256 L302 261" stroke-width="2.4"/>

    <path d="M559 256 C 565 255, 570 257, 575 256" stroke-width="2.6"/>
    <path d="M575 142 C 574 200, 576 315, 575 370" stroke-width="2.6"/>
    <path d="M575 142 C 581 141, 585 143, 591 142" stroke-width="2.6"/>
    <path d="M575 256 C 581 255, 585 257, 591 256" stroke-width="2.6"/>
    <path d="M575 370 C 581 369, 585 371, 591 370" stroke-width="2.6"/>
    <path d="M591 142 L582 137 M591 142 L582 147" stroke-width="2.4"/>
    <path d="M591 256 L582 251 M591 256 L582 261" stroke-width="2.4"/>
    <path d="M591 370 L582 365 M591 370 L582 375" stroke-width="2.4"/>
  </g>
  <circle cx="575" cy="256" r="3" fill="#141414"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#141414">
    <text x="184" y="244" font-size="21" font-weight="700" letter-spacing="0.2">You approve</text>
    <text x="184" y="270" font-size="18">the graph</text>

    <text x="435" y="190" font-size="21" font-weight="700" letter-spacing="0.2">One question round</text>
    <text x="435" y="212" font-size="17">once per topic</text>
    <text x="435" y="248" font-size="18">your goal</text>
    <text x="435" y="278" font-size="18">what you have already</text>
    <text x="435" y="299" font-size="18">read or used</text>
    <text x="435" y="330" font-size="18">concepts you can skip</text>

    <text x="731" y="118" font-size="21" font-weight="700" letter-spacing="0.2">beginner</text>
    <text x="731" y="143" font-size="18">numbered steps</text>
    <text x="731" y="162" font-size="18">every term explained</text>

    <text x="731" y="232" font-size="21" font-weight="700" letter-spacing="0.2">standard</text>
    <text x="731" y="262" font-size="18">today's writing standard</text>

    <text x="731" y="346" font-size="21" font-weight="700" letter-spacing="0.2">advanced</text>
    <text x="731" y="371" font-size="18">one pass</text>
    <text x="731" y="390" font-size="18">at most one example</text>
    <text x="731" y="409" font-size="18">per idea</text>
  </g>

  <path d="M644 442 C 704 440, 764 444, 818 441" fill="none" stroke="#D8D2C6" stroke-width="2" stroke-linecap="round"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#141414">
    <text x="731" y="466" font-size="18">Written to <tspan font-weight="600">graph.md</tspan>.</text>
    <text x="731" y="488" font-size="18">Every lecture follows it.</text>

    <text x="480" y="522" font-size="18">The questions, the teach-back, and the record stay the same.</text>
  </g>
</svg>
