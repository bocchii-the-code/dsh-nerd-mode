<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Calibration sets one teaching level for every lecture</title>
  <desc id="desc">You approve the concept graph, then answer one question round, once per topic: what you want to do with it, what you have read or used, and which concepts you can skip. The answers fan out to three teaching levels. Beginner uses numbered steps, explains every term, and shows an example per step. Standard gives intuition first, then the formal detail, with examples where useful. Advanced takes one pass with no steps, gives the formal statement first, and uses at most one example. The level is written to graph.md, and every lecture follows it. The questions, the teach-back, and the record stay the same.</desc>

  <rect x="8" y="8" width="944" height="624" rx="20" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#141414">
    <text x="480" y="62" text-anchor="middle" font-size="26" font-weight="600">One-time, before the first lecture</text>
  </g>

  <g fill="#FFFFFF" stroke="#141414" stroke-width="3.4" stroke-linejoin="round">
    <path d="M81 231 C 138 229, 206 234, 249 230 C 255 230, 265 235, 264 242 L264 341 C 264 347, 260 351, 253 350 C 192 352, 132 348, 81 351 C 74 351, 71 347, 72 340 L72 241 C 71 235, 75 231, 81 231 Z"/>
    <path d="M309 197 C 372 195, 462 200, 547 196 C 554 196, 559 201, 558 209 L558 373 C 558 380, 554 385, 546 384 C 484 386, 394 382, 309 385 C 301 385, 297 380, 298 372 L298 209 C 297 202, 301 197, 309 197 Z"/>
