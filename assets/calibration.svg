<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Calibration sets one teaching level for every lecture</title>
  <desc id="desc">You approve the concept graph, then answer one question round, once per topic: your goal, what you have already read or used, and the concepts you can skip. The answers fan out to three teaching levels. Beginner uses numbered steps and explains every term. Standard is today's writing standard. Advanced takes one pass with at most one example per idea. The level is written to graph.md, and every lecture follows that level. The questions, the teach-back, and the record stay the same.</desc>

  <rect x="8" y="8" width="944" height="544" rx="20" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#141414">
    <text x="480" y="62" text-anchor="middle" font-size="26" font-weight="600">One-time, before the first lecture</text>
  </g>

  <g fill="#FFFFFF" stroke="#141414" stroke-width="3.4" stroke-linejoin="round">
    <path d="M103 196 C 160 194, 230 199, 273 195 C 279 195, 283 200, 282 207 L282 306 C 282 312, 278 316, 271 315 C 210 317, 150 313, 103 316 C 96 316, 93 312, 94 305 L94 206 C 93 200, 97 196, 103 196 Z"/>
    <path d="M327 152 C 390 150, 480 155, 543 151 C 550 151, 555 156, 554 164 L554 348 C 554 355, 550 360, 542 359 C 480 361, 390 357, 327 360 C 319 360, 315 355, 316 347 L316 164 C 315 157, 319 152, 327 152 Z"/>
    <path d="M599 88 C 660 86, 790 90, 855 87 C 862 87, 867 92, 866 99 L866 184 C 866 190, 862 194, 855 193 C 790 195, 660 191, 599 194 C 592 194, 587 190, 588 183 L588 98 C 587 92, 591 88, 599 88 Z"/>
    <path d="M599 202 C 665 200, 785 204, 855 201 C 862 201, 867 206, 866 213 L866 298 C 866 304, 862 308, 855 307 C 790 309, 660 305, 599 308 C 592 308, 587 304, 588 297 L588 212 C 587 206, 591 202, 599 202 Z"/>
    <path d="M599 316 C 660 314, 790 318, 855 315 C 862 315, 867 320, 866 327 L866 412 C 866 418, 862 422, 855 421 C 790 423, 660 419, 599 422 C 592 422, 587 418, 588 411 L588 326 C 587 320, 591 316, 599 316 Z"/>
  </g>

  <g fill="none" stroke="#141414" stroke-linecap="round" stroke-linejoin="round">
    <path d="M283 256 C 292 255, 302 257, 310 256" stroke-width="2.6"/>
    <path d="M315 256 L306 251 M315 256 L306 261" stroke-width="2.4"/>

    <path d="M554 256 C 560 255, 565 257, 571 256" stroke-width="2.6"/>
    <path d="M571 142 C 570 200, 572 315, 571 370" stroke-width="2.6"/>
    <path d="M571 142 C 577 141, 581 143, 587 142" stroke-width="2.6"/>
    <path d="M571 256 C 577 255, 581 257, 587 256" stroke-width="2.6"/>
    <path d="M571 370 C 577 369, 581 371, 587 370" stroke-width="2.6"/>
    <path d="M587 142 L578 137 M587 142 L578 147" stroke-width="2.4"/>
    <path d="M587 256 L578 251 M587 256 L578 261" stroke-width="2.4"/>
    <path d="M587 370 L578 365 M587 370 L578 375" stroke-width="2.4"/>
  </g>
  <circle cx="571" cy="256" r="3" fill="#141414"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#141414">
    <text x="188" y="244" font-size="21" font-weight="700" letter-spacing="0.2">You approve</text>
    <text x="188" y="270" font-size="18">the graph</text>

    <text x="435" y="190" font-size="21" font-weight="700" letter-spacing="0.2">One question round</text>
    <text x="435" y="212" font-size="17">once per topic</text>
    <text x="435" y="248" font-size="18">your goal</text>
    <text x="435" y="278" font-size="18">what you have already</text>
    <text x="435" y="299" font-size="18">read or used</text>
    <text x="435" y="330" font-size="18">concepts you can skip</text>

    <text x="727" y="118" font-size="21" font-weight="700" letter-spacing="0.2">beginner</text>
    <text x="727" y="143" font-size="18">numbered steps</text>
    <text x="727" y="162" font-size="18">every term explained</text>

    <text x="727" y="232" font-size="21" font-weight="700" letter-spacing="0.2">standard</text>
    <text x="727" y="262" font-size="18">today's writing standard</text>

    <text x="727" y="346" font-size="21" font-weight="700" letter-spacing="0.2">advanced</text>
    <text x="727" y="371" font-size="18">one pass</text>
    <text x="727" y="390" font-size="18">at most one example</text>
    <text x="727" y="409" font-size="18">per idea</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle" fill="#141414">
    <text x="727" y="466" font-size="18">Written to <tspan font-weight="600">graph.md</tspan>.</text>
    <text x="727" y="488" font-size="18">Every lecture follows that level.</text>

    <text x="480" y="522" font-size="18">The questions, the teach-back, and the record stay the same.</text>
  </g>
</svg>
