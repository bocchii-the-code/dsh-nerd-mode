# Nerd Mode is a profile-level plugin, not a preset. See docs/adr/0008.
- insert:
    - id: dsh-nerd-mode
      name: dsh-nerd-mode
      config:
        recallSessionEnabled: false
        unseenQuestionCount: 3
        unseenQuestionType: short-answer
    - id: study-plus-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: study-plus
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-nerd-mode/package.json')), 'skills')
